<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>P2P Node Report</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 0;
    padding: 0;
    background: #f6f8fa;
    color: #24292f;
    line-height: 1.5;
  }
  header {
    background: #24292f;
    color: #fff;
    padding: 24px 40px;
  }
  header h1 { margin: 0 0 6px 0; font-size: 24px; }
  header p { margin: 0; opacity: 0.7; font-size: 14px; }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 40px;
  }
  section {
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  section > h2 {
    margin: 0;
    padding: 16px 20px;
    font-size: 18px;
    background: #f6f8fa;
    border-bottom: 1px solid #d0d7de;
  }
  section > div { padding: 16px 20px; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #d0d7de;
  }
  th {
    background: #f6f8fa;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  th:hover { background: #eef1f4; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .mono {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-ok { background: #ddf4e0; color: #1a7f37; }
  .badge-warn { background: #fff5cc; color: #9a6700; }
  .badge-err { background: #ffebe9; color: #cf222e; }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .metric-card {
    background: #f6f8fa;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 12px;
  }
  .metric-card .label {
    font-size: 12px;
    color: #57606a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .metric-card .value {
    font-size: 22px;
    font-weight: 600;
    color: #24292f;
  }
  .metric-card .sub {
    font-size: 11px;
    color: #57606a;
    margin-top: 4px;
  }
  .controls {
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 6px 10px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  .controls input { width: 240px; }
  .controls label {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #57606a;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
  }
  #graph {
    width: 100%;
    height: 640px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #fafbfc;
  }
  #graph svg { display: block; }
  footer {
    padding: 24px 40px;
    text-align: center;
    color: #57606a;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>P2P Node Report</h1>
  <p id="report-meta">Loading...</p>
</header>

<main>

  <!-- ==== Обзор ==== -->
  <section>
    <h2>Обзор</h2>
    <div>
      <div class="metrics-grid" id="overview-metrics"></div>
    </div>
  </section>

  <!-- ==== Граф сети ==== -->
  <section>
    <h2>Граф сети</h2>
    <div>
      <div class="controls">
        <select id="graph-mode">
          <option value="overlay">Overlay (все связи)</option>
          <option value="topk">TopK (3 ближайших по XOR на узел)</option>
          <option value="tree">Tree (иерархия от seed)</option>
        </select>
        <label><input type="checkbox" id="graph-labels" checked> Подписи</label>
        <label><input type="checkbox" id="graph-arrows" checked> Стрелки</label>
        <span class="legend">
          <span class="legend-item"><span class="legend-dot" style="background:#ffd6a5"></span> seed</span>
          <span class="legend-item"><span class="legend-dot" style="background:#cfe2ff"></span> узел</span>
          <span class="legend-item">клик — подсветить связи</span>
        </span>
      </div>
      <div id="graph"></div>
    </div>
  </section>

  <!-- ==== Routing-таблицы ==== -->
  <section>
    <h2>Routing-таблицы</h2>
    <div>
      <div class="controls">
        <input type="text" id="routing-filter" placeholder="Фильтр по NodeID...">
        <select id="routing-sort">
          <option value="node_id">Сортировка: NodeID</option>
          <option value="size">Сортировка: size</option>
          <option value="bucket_count">Сортировка: buckets</option>
          <option value="max_bucket_fill">Сортировка: max_fill</option>
        </select>
      </div>
      <table id="routing-table">
        <thead>
          <tr>
            <th>NodeID</th>
            <th>Size</th>
            <th>Buckets</th>
            <th>Max fill</th>
            <th>Min fill</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ==== Lookup-логи ==== -->
  <section>
    <h2>Lookup-логи</h2>
    <div>
      <table id="lookups-table">
        <thead>
          <tr>
            <th>Target</th>
            <th>Initiator</th>
            <th>Absent</th>
            <th>RPC</th>
            <th>Iters</th>
            <th>Timeouts</th>
            <th>Duration</th>
            <th>Found</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ==== Сравнение bootstrap-схем ==== -->
  <section id="star-ring-section" style="display:none;">
    <h2>Star vs Ring</h2>
    <div id="star-ring-content"></div>
  </section>

  <!-- ==== Сравнение сериализаций ==== -->
  <section id="serialization-section" style="display:none;">
    <h2>Сериализация: msgpack / JSON / gob</h2>
    <div id="serialization-content"></div>
  </section>

</main>

<footer>
  Generated by <span class="mono">scripts/generate_report.sh</span>
</footer>

<script>
// ==== Встроенный D3.js ====
__D3_INLINE__

// ==== Встроенные данные ====
const REPORT_DATA = __REPORT_DATA__;

// ==== Обзор ====
(function renderOverview() {
  const el = document.getElementById('overview-metrics');
  const routing = REPORT_DATA.routing || [];
  const lookups = REPORT_DATA.lookups || [];

  const totalNodes = routing.length;
  const sizes = routing.map(r => r.size || 0);
  const meanSize = sizes.length ? sizes.reduce((a, b) => a + b, 0) / sizes.length : 0;

  const lookupRPC = lookups.map(l => l.rpc || 0);
  const meanRPC = lookupRPC.length ? lookupRPC.reduce((a, b) => a + b, 0) / lookupRPC.length : 0;
  const successCount = lookups.filter(l => l.found).length;

  const cards = [
    { label: 'Nodes', value: totalNodes, sub: 'routing snapshots' },
    { label: 'Mean table size', value: meanSize.toFixed(2), sub: `min=${Math.min(...sizes, 0)} max=${Math.max(...sizes, 0)}` },
    { label: 'Lookups', value: lookups.length, sub: 'total' },
    { label: 'Mean RPC', value: meanRPC.toFixed(2), sub: 'per lookup' },
    { label: 'Successful lookups', value: `${successCount}/${lookups.length}`, sub: lookups.length ? `${(successCount/lookups.length*100).toFixed(1)}%` : '—' },
  ];

  el.innerHTML = cards.map(c => `
    <div class="metric-card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join('');
})();

// ==== Граф сети через D3.js ====
(function renderGraph() {
  const graphEl = document.getElementById('graph');
  const modeSelect = document.getElementById('graph-mode');
  const labelsCheckbox = document.getElementById('graph-labels');
  const arrowsCheckbox = document.getElementById('graph-arrows');

  if (!window.d3) {
    graphEl.innerHTML = '<p style="padding:20px;color:#cf222e;">D3.js не загружен.</p>';
    return;
  }
  const d3 = window.d3;

  const routing = REPORT_DATA.routing || [];
  const rawEdges = REPORT_DATA.edges || [];

  if (!routing.length) {
    graphEl.innerHTML = '<p style="padding:20px;color:#57606a;">Нет данных routing.</p>';
    return;
  }

  // Определяем seed — узел с максимальным out-degree.
  const outDeg = {};
  for (const e of rawEdges) {
    outDeg[e.source] = (outDeg[e.source] || 0) + 1;
  }
  let seedId = null;
  let maxDeg = -1;
  for (const [id, d] of Object.entries(outDeg)) {
    if (d > maxDeg) { maxDeg = d; seedId = id; }
  }

  // Узлы.
  const nodes = routing.map(r => ({
    id: r.node_id,
    short: r.node_id.slice(0, 8),
    size: r.size || 0,
    isSeed: r.node_id === seedId,
  }));
  const nodeById = new Map(nodes.map(n => [n.id, n]));

  // Функция получения рёбер в зависимости от режима.
  function getEdges(mode) {
    if (mode === 'overlay') {
      return rawEdges.map(e => ({ source: e.source, target: e.target }));
    }
    if (mode === 'topk') {
      // 3 ближайших по XOR на узел.
      const bySrc = {};
      for (const e of rawEdges) {
        (bySrc[e.source] = bySrc[e.source] || []).push(e.target);
      }
      const out = [];
      const seen = new Set();
      for (const [src, dsts] of Object.entries(bySrc)) {
        const srcNum = BigInt('0x' + src);
        const sorted = dsts.slice().sort((a, b) => {
          const da = srcNum ^ BigInt('0x' + a);
          const db = srcNum ^ BigInt('0x' + b);
          return da < db ? -1 : da > db ? 1 : 0;
        });
        for (const d of sorted.slice(0, 3)) {
          const key = `${src}->${d}`;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({ source: src, target: d });
        }
      }
      return out;
    }
    if (mode === 'tree') {
      // Рёбра от seed к его контактам.
      return rawEdges
        .filter(e => e.source === seedId)
        .map(e => ({ source: e.source, target: e.target }));
    }
    return [];
  }

  let simulation;
  let svg;

  function render() {
    const mode = modeSelect.value;
    const showLabels = labelsCheckbox.checked;
    const showArrows = arrowsCheckbox.checked;

    // Очищаем.
    graphEl.innerHTML = '';

    const width = graphEl.clientWidth || 1000;
    const height = graphEl.clientHeight || 640;

    const edges = getEdges(mode);

    // Копируем узлы, чтобы D3 не мутировал оригинал.
    const simNodes = nodes.map(n => ({ ...n }));
    const simEdges = edges.map(e => ({
      source: e.source,
      target: e.target,
    }));

    svg = d3.select(graphEl)
      .append('svg')
      .attr('width', width)
      .attr('height', height)
      .attr('viewBox', [0, 0, width, height]);

    // Стрелки.
    if (showArrows) {
      svg.append('defs')
        .append('marker')
        .attr('id', 'arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 18)
        .attr('refY', 0)
        .attr('markerWidth', 6)
        .attr('markerHeight', 6)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', '#888888');
    }

    const link = svg.append('g')
      .selectAll('line')
      .data(simEdges)
      .join('line')
      .attr('stroke', '#888888')
      .attr('stroke-width', 1)
      .attr('stroke-opacity', 0.5)
      .attr('marker-end', showArrows ? 'url(#arrow)' : null);

    const node = svg.append('g')
      .selectAll('circle')
      .data(simNodes)
      .join('circle')
      .attr('r', d => 8 + Math.min(d.size, 12))
      .attr('fill', d => d.isSeed ? '#ffd6a5' : '#cfe2ff')
      .attr('stroke', '#24292f')
      .attr('stroke-width', 1.5)
      .style('cursor', 'pointer')
      .call(d3.drag()
        .on('start', dragStart)
        .on('drag', dragged)
        .on('end', dragEnd));

    // Подписи.
    let label = null;
    if (showLabels) {
      label = svg.append('g')
        .selectAll('text')
        .data(simNodes)
        .join('text')
        .text(d => d.short)
        .attr('font-family', 'Helvetica, sans-serif')
        .attr('font-size', 11)
        .attr('text-anchor', 'middle')
        .attr('dy', d => 8 + Math.min(d.size, 12) + 12)
        .style('pointer-events', 'none')
        .style('user-select', 'none');
    }

    // Подсветка при клике.
    let selected = null;
    node.on('click', (event, d) => {
      event.stopPropagation();
      if (selected === d.id) {
        selected = null;
        node.attr('stroke-width', 1.5).attr('stroke', '#24292f');
        link.attr('stroke-opacity', 0.5).attr('stroke', '#888888');
      } else {
        selected = d.id;
        node.attr('stroke-width', d2 => d2.id === selected ? 4 : 1.5)
            .attr('stroke', d2 => d2.id === selected ? '#cf222e' : '#24292f');
        link.attr('stroke-opacity', e => (e.source.id === selected || e.target.id === selected) ? 1 : 0.1)
            .attr('stroke', e => (e.source.id === selected || e.target.id === selected) ? '#cf222e' : '#888888');
      }
    });

    svg.on('click', () => {
      selected = null;
      node.attr('stroke-width', 1.5).attr('stroke', '#24292f');
      link.attr('stroke-opacity', 0.5).attr('stroke', '#888888');
    });

    // Симуляция.
    simulation = d3.forceSimulation(simNodes)
      .force('link', d3.forceLink(simEdges).id(d => d.id).distance(80))
      .force('charge', d3.forceManyBody().strength(-300))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force('collision', d3.forceCollide().radius(d => 8 + Math.min(d.size, 12) + 4))
      .on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        node
          .attr('cx', d => d.x)
          .attr('cy', d => d.y);
        if (label) {
          label
            .attr('x', d => d.x)
            .attr('y', d => d.y);
        }
      });

    function dragStart(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }
    function dragged(event, d) {
      d.fx = event.x; d.fy = event.y;
    }
    function dragEnd(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }
  }

  modeSelect.addEventListener('change', render);
  labelsCheckbox.addEventListener('change', render);
  arrowsCheckbox.addEventListener('change', render);
  window.addEventListener('resize', () => {
    clearTimeout(window.__graphResizeTimer);
    window.__graphResizeTimer = setTimeout(render, 200);
  });

  render();
})();

// ==== Routing-таблица ====
(function renderRouting() {
  const tbody = document.querySelector('#routing-table tbody');
  const filterInput = document.getElementById('routing-filter');
  const sortSelect = document.getElementById('routing-sort');

  let data = (REPORT_DATA.routing || []).slice();

  function render() {
    const filter = filterInput.value.toLowerCase();
    const sortKey = sortSelect.value;

    let filtered = data.filter(r => !filter || (r.node_id || '').toLowerCase().includes(filter));
    filtered.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === 'number' && typeof bv === 'number') return av - bv;
      return String(av).localeCompare(String(bv));
    });

    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td class="mono">${(r.node_id || '').slice(0, 16)}</td>
        <td>${r.size || 0}</td>
        <td>${r.bucket_count || 0}</td>
        <td>${r.max_bucket_fill || 0}</td>
        <td>${r.min_bucket_fill || 0}</td>
      </tr>
    `).join('');
  }

  filterInput.addEventListener('input', render);
  sortSelect.addEventListener('change', render);
  render();
})();

// ==== Lookup-таблица ====
(function renderLookups() {
  const tbody = document.querySelector('#lookups-table tbody');
  const data = REPORT_DATA.lookups || [];

  tbody.innerHTML = data.map(l => `
    <tr>
      <td class="mono">${(l.target || '').slice(0, 12)}</td>
      <td class="mono">${(l.initiator || '').slice(0, 12)}</td>
      <td>${l.target_absent_at_start ? '<span class="badge badge-ok">yes</span>' : '<span class="badge badge-warn">no</span>'}</td>
      <td>${l.rpc || 0}</td>
      <td>${l.iterations || 0}</td>
      <td>${l.timeouts || 0}</td>
      <td>${l.duration_ms || 0} ms</td>
      <td>${l.found ? '<span class="badge badge-ok">✓</span>' : '<span class="badge badge-err">✗</span>'}</td>
    </tr>
  `).join('');
})();

// ==== Star vs Ring ====
(function renderStarRing() {
  const data = REPORT_DATA.starRing;
  if (!data) return;

  document.getElementById('star-ring-section').style.display = 'block';
  const el = document.getElementById('star-ring-content');

  const metrics = [
    ['nodes', 'Nodes'],
    ['size_min', 'Table size min'],
    ['size_max', 'Table size max'],
    ['size_mean', 'Table size mean'],
    ['buckets_mean', 'Buckets per node mean'],
    ['max_fill_max', 'Max bucket fill'],
    ['edges_total', 'Edges total'],
    ['max_out_degree', 'Max out-degree'],
  ];

  let html = '<table><thead><tr><th>Metric</th><th>Star</th><th>Ring</th><th>Diff</th></tr></thead><tbody>';
  for (const [key, label] of metrics) {
    const s = data.star[key] ?? '—';
    const r = data.ring[key] ?? '—';
    const diff = (typeof s === 'number' && typeof r === 'number') ? (r - s).toFixed(2) : '—';
    html += `<tr><td>${label}</td><td>${s}</td><td>${r}</td><td>${diff}</td></tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
})();

// ==== Сериализация ====
(function renderSerialization() {
  const data = REPORT_DATA.serialization;
  if (!data || !data.length) return;

  document.getElementById('serialization-section').style.display = 'block';
  const el = document.getElementById('serialization-content');

  let html = '<table><thead><tr><th>Format</th><th>Size (bytes)</th><th>Encode (µs/msg)</th><th>Decode (µs/msg)</th></tr></thead><tbody>';
  for (const r of data) {
    html += `<tr><td>${r.format}</td><td>${r.size_bytes}</td><td>${r.encode_us_per_msg.toFixed(3)}</td><td>${r.decode_us_per_msg.toFixed(3)}</td></tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
})();

// ==== Мета ====
(function renderMeta() {
  const el = document.getElementById('report-meta');
  const now = new Date().toLocaleString('ru-RU');
  el.textContent = `Сгенерировано: ${now} · Узлов: ${(REPORT_DATA.routing || []).length} · Lookup'ов: ${(REPORT_DATA.lookups || []).length}`;
})();
</script>

</body>
</html>
